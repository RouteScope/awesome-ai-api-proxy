name: Weekly price refresh

# Auto-scrapes every provider with a pricing.fetcher in data/providers.yaml,
# rebuilds data/prices.latest.json + docs/prices.md + README markers,
# and opens a PR labeled `price-refresh` for the maintainer to review.

on:
  schedule:
    - cron: "0 2 * * 0" # Sundays 02:00 UTC = Sunday 10:00 Taipei
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Scrape all fetchers
        id: scrape
        run: python -m scripts.scrape

      - name: Build prices
        run: python -m scripts.build_prices

      - name: Validate
        run: python -m scripts.validate

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize failures
        if: steps.diff.outputs.changed == 'true'
        id: summary
        run: |
          today=$(date -u +%F)
          fail_dir="data/snapshots/$today"
          if compgen -G "$fail_dir/*.error.json" > /dev/null; then
            failed=$(ls "$fail_dir"/*.error.json 2>/dev/null | xargs -I{} basename {} .error.json | tr '\n' ' ')
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
          else
            echo "failed=" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/price-refresh-${{ github.run_number }}
          commit-message: "chore: weekly price refresh"
          title: "chore: weekly price refresh"
          labels: |
            price-refresh
            automated
          body: |
            Auto-generated by `.github/workflows/price-refresh.yml`.

            **Snapshot date:** ${{ github.run_id }} run
            **Failed fetchers:** `${{ steps.summary.outputs.failed || '(none)' }}`

            Please review the diff in `data/snapshots/`, `data/prices.latest.json`,
            and the regenerated README price tables before merging.

            If any fetcher wrote a `*.error.json`, investigate (the underlying
            site likely changed their API shape) and fix that fetcher before merging.
